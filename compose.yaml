services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dbformacion
      MYSQL_USER: ${AD03_DB_USER:-ad03}
      MYSQL_PASSWORD: ${AD03_DB_PASSWORD:-ad03-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./sql/dbformacion.sql:/docker-entrypoint-initdb.d/01-dbformacion.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      AD03_DB_URL: jdbc:mysql://mysql:3306/dbformacion?serverTimezone=UTC&useSSL=false
      AD03_DB_USER: ${AD03_DB_USER:-ad03}
      AD03_DB_PASSWORD: ${AD03_DB_PASSWORD:-ad03-local}
    command:
      - mvn
      - -q
      - exec:java
      - -Dexec.mainClass=${AD03_MAIN_CLASS:-es.ejemplo.ad03.ejercicio1.ListadoCursos}
    stdin_open: true
    tty: true

volumes:
  db-data:
